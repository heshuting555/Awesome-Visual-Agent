name: Update Star History

on:
  watch:
    types: [started]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Check out the Star History chart renderer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: star-history/star-history
          ref: 8f5608175d95aa224c656e8b4efa55ed094b889f
          path: .star-history-renderer
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the renderer dependencies
        run: |
          npx --yes pnpm@10.26.1 --dir .star-history-renderer install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10.26.1 --dir .star-history-renderer/backend install --frozen-lockfile --ignore-scripts
      - name: Generate light and dark charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp .github/scripts/update-star-history.mts .star-history-renderer/backend/
          npx --yes pnpm@10.26.1 --dir .star-history-renderer/backend exec tsx update-star-history.mts "$GITHUB_WORKSPACE/figs"
      - name: Publish refreshed charts
        run: |
          git add -- figs/star-history-since-2026-11-20.svg figs/star-history-since-2026-11-20-dark.svg
          if git diff --cached --quiet; then
            echo "Star history is already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh Star History charts'
          git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
